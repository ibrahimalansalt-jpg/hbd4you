<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petualangan Ulang Tahun — Kota Gelembung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PETUALANGAN ULANG TAHUN · KOTA GELEMBUNG
   Satu file. Isi cerita ada di blok <script id="story"> (dekat bagian bawah),
   atau klik tombol ✎ di pojok kanan atas untuk mengisinya langsung di layar.
   ===================================================================== */
:root{--u:8px;--ink:#0b3a52;--paper:#fbefcf;--paper2:#f3dca0;--gold:#f6c744;--coral:#ff7a6b;--teal:#19b5b0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#06324a;color:var(--ink);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif}
button{font:inherit;cursor:pointer;border:0}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}

/* ---------- langit/air: tiga lapis yang saling memudar sesuai umur perjalanan ---------- */
.sky{position:absolute;inset:0}
#sky1{background:linear-gradient(#1668dc 0,#2f9fee 34%,#6fd3f3 70%,#a8ecf3 100%)}
#sky2{background:linear-gradient(#1456c4,#2a86d6 40%,#4fb9de 80%,#79d3e6);opacity:0}
#sky3{background:linear-gradient(#ffc27a 0,#f98a8c 28%,#8a62bb 62%,#1a3a73 100%);opacity:0}
#rays{position:absolute;inset:-20% -10% 30% -10%;opacity:.5;
  background:repeating-linear-gradient(105deg,rgba(255,255,255,0) 0 7%,rgba(255,255,255,.22) 9% 12%,rgba(255,255,255,0) 14% 22%);
  animation:ray 9s ease-in-out infinite alternate}
@keyframes ray{from{opacity:.25;transform:translate3d(-3%,0,0)}to{opacity:.6;transform:translate3d(3%,0,0)}}
.lay{position:absolute;left:0;bottom:0;will-change:transform;pointer-events:none}
#far{height:calc(var(--u)*70);background-repeat:repeat-x;background-position:0 100%;background-size:calc(var(--u)*140) 100%}
#mid{height:calc(var(--u)*40);background-repeat:repeat-x;background-position:0 100%;background-size:calc(var(--u)*110) 100%}
#world{position:absolute;left:0;bottom:0;height:100%;will-change:transform}
#front{height:100%;z-index:6}
.ground{position:absolute;left:0;right:0;bottom:calc(var(--u)*-12);height:calc(var(--u)*32);background:linear-gradient(#f2eaa9,#e8dc8c 40%,#d3c273);
  box-shadow:inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.3)}
.road{position:absolute;left:0;right:0;bottom:calc(var(--u)*14.5);height:calc(var(--u)*9);background:linear-gradient(#7c929c,#62798a);border-radius:calc(var(--u)*4);
  box-shadow:0 calc(var(--u)*.7) 0 rgba(0,0,0,.18),inset 0 calc(var(--u)*.5) 0 rgba(255,255,255,.2)}
.road:after{content:"";position:absolute;left:calc(var(--u)*2);right:calc(var(--u)*2);top:50%;height:calc(var(--u)*.7);margin-top:calc(var(--u)*-.35);
  background:repeating-linear-gradient(90deg,#e8e4b8 0 calc(var(--u)*4),transparent calc(var(--u)*4) calc(var(--u)*8));opacity:.85}
.ground:before{content:"";position:absolute;left:0;right:0;top:calc(var(--u)*-1.6);height:calc(var(--u)*2);
  background:radial-gradient(circle at 50% 100%,#f2eaa9 0 68%,transparent 70%) 0 0/calc(var(--u)*7) 100% repeat-x}
.ground:after{content:"";position:absolute;inset:calc(var(--u)*13) 0 calc(var(--u)*12) 0;opacity:.5;
  background:radial-gradient(circle,#c9b565 0 9%,transparent 11%) 0 0/calc(var(--u)*7) calc(var(--u)*5)}

/* ---------- benda di dunia ---------- */
.p{position:absolute;display:block;pointer-events:none;z-index:1}
.p svg{width:100%;height:100%;display:block;overflow:visible}
.p img{width:100%;height:100%;object-fit:contain;object-position:50% 100%;display:block}
.p.f{z-index:3}
.kelp{transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite alternate}
.kelp.b{animation-duration:5.8s;animation-delay:-2s}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.glow{animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25)}}
.bw{position:absolute;display:block;pointer-events:none;z-index:2;animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(calc(var(--u)*-1.5))}to{transform:translateY(calc(var(--u)*1.5))}}

/* papan penunjuk bab */
.sign{position:absolute;bottom:calc(var(--u)*17.5);width:calc(var(--u)*20);height:calc(var(--u)*26);z-index:2;cursor:pointer;pointer-events:auto}
.sign .post{position:absolute;left:50%;bottom:0;width:calc(var(--u)*2.2);height:calc(var(--u)*17);margin-left:calc(var(--u)*-1.1);background:linear-gradient(90deg,#8a5a2b,#b07a3f 50%,#7a4d22);border-radius:calc(var(--u)*.8)}
.sign .board{position:absolute;left:0;right:0;top:calc(var(--u)*3);height:calc(var(--u)*13);background:linear-gradient(#d9a45e,#bf8442);border:calc(var(--u)*.5) solid #6e4720;border-radius:calc(var(--u)*1.6);
  display:grid;place-items:center;text-align:center;line-height:1.05;color:#4b2a0c;box-shadow:0 calc(var(--u)*.8) 0 rgba(0,0,0,.2)}
.sign b{font-size:calc(var(--u)*3.6);display:block}
.sign small{font-size:calc(var(--u)*2);display:block;font-weight:600}
.sign small.ps{font-size:calc(var(--u)*1.55);letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.sign .pearl{position:absolute;left:50%;top:calc(var(--u)*-3);width:calc(var(--u)*5);height:calc(var(--u)*5);margin-left:calc(var(--u)*-2.5);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#d9f7ff 35%,#8fd6ee 70%,#4aa4c9);box-shadow:0 0 calc(var(--u)*3) rgba(255,255,255,.9);animation:bob 2.2s ease-in-out infinite alternate}
.sign.done .pearl{background:radial-gradient(circle at 35% 30%,#fff7c8,#ffd966 55%,#e0a415);box-shadow:0 0 calc(var(--u)*3) rgba(255,215,90,.9)}
.sign.done .board:after{content:"✔";position:absolute;right:calc(var(--u)*1);top:calc(var(--u)*.4);font-size:calc(var(--u)*2.6);color:#2a8a3a}

/* ---------- pemain ---------- */
#player{position:absolute;left:0;bottom:calc(var(--u)*5.5);width:calc(var(--u)*13);height:calc(var(--u)*18);z-index:4;will-change:transform;pointer-events:none}
#pin{width:100%;height:100%;transition:transform .15s}
#player svg{width:100%;height:100%;overflow:visible;display:block}
#pbody{animation:none}
#player.walk #pbody{animation:step .34s ease-in-out infinite alternate}
@keyframes step{from{transform:translateY(0)}to{transform:translateY(calc(var(--u)*-1.2))}}
#legL,#legR{transform-origin:50% 0;transform-box:fill-box}
#player.walk #legL{animation:leg .34s ease-in-out infinite alternate}
#player.walk #legR{animation:leg .34s ease-in-out infinite alternate-reverse}
@keyframes leg{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
#buddy{position:absolute;left:0;bottom:calc(var(--u)*17);width:calc(var(--u)*7);height:calc(var(--u)*5);z-index:4;will-change:transform;pointer-events:none}
#buddy svg{width:100%;height:100%;overflow:visible}
#prompt{position:absolute;left:0;bottom:calc(var(--u)*28);z-index:7;will-change:transform;transition:opacity .2s;pointer-events:auto}
#prompt button{background:#fff;border-radius:99px;padding:.45em 1em;font-weight:600;color:var(--ink);box-shadow:0 .3em 0 rgba(0,0,0,.2);animation:bob 1.2s ease-in-out infinite alternate;white-space:nowrap}

/* ---------- gelembung & ikan di layar ---------- */
#bubbles{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
#bubbles i{position:absolute;bottom:-10%;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(255,255,255,.08) 60%);
  animation:rise var(--t) linear var(--d) infinite;will-change:transform}
@keyframes rise{from{transform:translate3d(0,0,0)}to{transform:translate3d(var(--dx),-115vh,0)}}
#fish{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#fish i{position:absolute;left:0;width:calc(var(--u)*6);height:calc(var(--u)*3.6);animation:swim var(--t) linear var(--d) infinite;will-change:transform}
@keyframes swim{from{transform:translate3d(-12vw,0,0)}to{transform:translate3d(112vw,0,0)}}
#fish svg{width:100%;height:100%}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;gap:.6rem;align-items:center;padding:calc(.6rem + env(safe-area-inset-top)) .8rem .6rem;pointer-events:none}
#hud>*{pointer-events:auto}
.chip{background:rgba(255,255,255,.88);border-radius:99px;padding:.35rem .8rem;font-weight:600;font-size:.9rem;box-shadow:0 .2rem 0 rgba(0,0,0,.15);display:flex;gap:.45rem;align-items:center;min-height:2.3rem}
#dots{display:flex;gap:.3rem}
#dots i{width:.7rem;height:.7rem;border-radius:50%;background:#b8d6e2;border:2px solid #fff;box-shadow:0 0 0 1px #8fb9c9}
#dots i.on{background:radial-gradient(circle at 35% 30%,#fff7c8,#ffd24a 60%,#e0a415);box-shadow:0 0 .5rem rgba(255,210,70,.9)}
#chlbl{flex:1;justify-content:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;text-align:center}
.ib{width:2.5rem;height:2.5rem;border-radius:50%;background:rgba(255,255,255,.9);font-size:1.15rem;box-shadow:0 .2rem 0 rgba(0,0,0,.15);display:grid;place-items:center;padding:0}
.ib.on{background:var(--gold)}
#ctl{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;padding:.8rem .9rem calc(.9rem + env(safe-area-inset-bottom));pointer-events:none}
#ctl>*{pointer-events:auto}
.arr{width:4.4rem;height:4.4rem;border-radius:50%;background:rgba(255,255,255,.88);font-size:1.9rem;color:var(--ink);box-shadow:0 .3rem 0 rgba(0,0,0,.18);touch-action:none}
.arr:active,.arr.dn{transform:translateY(.15rem);box-shadow:0 .1rem 0 rgba(0,0,0,.18)}
#auto{background:var(--gold);color:#4b2a0c;border-radius:99px;padding:.8rem 1.2rem;font-weight:600;box-shadow:0 .3rem 0 #c79a1d;margin-bottom:.4rem}
#auto:active{transform:translateY(.15rem)}
#toast{position:fixed;left:50%;bottom:7rem;transform:translate(-50%,2rem);background:#0b3a52;color:#fff;padding:.6rem 1.1rem;border-radius:99px;opacity:0;transition:.3s;z-index:90;pointer-events:none;text-align:center;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- sampul buku ---------- */
#cover{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:linear-gradient(#1668dc,#2f9fee 45%,#79d3ee);perspective:1600px;transition:opacity .5s .5s}
#cover.open{opacity:0;pointer-events:none}
#cover .cbub{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#cover .cbub i{position:absolute;bottom:-10%;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),rgba(255,255,255,.05) 60%);animation:rise var(--t) linear var(--d) infinite}
.cb{position:relative;width:min(88vw,420px);height:min(78vh,600px);transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.5,0,.2,1)}
#cover.open .cb{transform:rotateY(-168deg)}
.cb .face{position:absolute;inset:0;border-radius:.6rem 1.4rem 1.4rem .6rem;backface-visibility:hidden;overflow:hidden;
  background:linear-gradient(#69b3f6,#3a8be6 52%,#2468cc);box-shadow:0 1.5rem 3rem rgba(0,30,50,.5),inset 0 0 0 .5rem rgba(255,255,255,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:.5rem;padding:2rem 1.4rem 1.4rem;text-align:center;color:#fff}
.cb .back{transform:rotateY(180deg);background:var(--paper)}
.cb .spine{position:absolute;left:0;top:0;bottom:0;width:1rem;background:linear-gradient(90deg,#15409a,#2468cc);z-index:3}
.cb .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.cb .ctop,.cb .cmid,.cb #go{position:relative;z-index:2}
.cb .kick{font-size:.78rem;letter-spacing:.28em;font-weight:600;color:#12347f}
.cb h1{margin:.2rem 0 0;font-family:'Caveat','Segoe Script','Brush Script MT',cursive;font-weight:600;font-size:clamp(2.2rem,10.5vw,3.7rem);line-height:.95;white-space:nowrap;color:#fff;text-shadow:0 .05em 0 rgba(15,58,134,.45)}
.cb .nm{font-weight:600;font-size:clamp(1.25rem,5.6vw,1.8rem);letter-spacing:.06em;color:#12347f;margin-top:.5rem;min-width:3ch;outline:none;word-break:break-word;text-transform:uppercase}
.cb .ag{font-size:.9rem;font-weight:600;letter-spacing:.1em;color:#12347f;text-transform:uppercase;outline:none}
.cb .op{margin:.4rem auto 0;max-width:24ch;font-size:.92rem;line-height:1.4;outline:none;color:#fff;text-shadow:0 1px 3px rgba(15,58,134,.6)}
#go{background:#fff;color:#12347f;border-radius:99px;padding:.8rem 1.4rem;font-weight:600;font-size:1.02rem;box-shadow:0 .3rem 0 rgba(15,58,134,.55)}
#go:active{transform:translateY(.15rem)}

/* ---------- pop-up book (bab kenangan) ---------- */
#pop,#fin{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(2,26,42,.78);padding:2.8rem .6rem .6rem}
.pb{position:relative;width:min(96vw,1000px);max-height:calc(100vh - 3.6rem);display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(90deg,var(--paper),#f6e5b9 49.5%,#d8bd80 50%,#f6e5b9 50.5%,var(--paper));
  border-radius:.9rem;box-shadow:0 1.5rem 3rem rgba(0,0,0,.5),0 0 0 .45rem #0a5f73,0 0 0 .6rem var(--gold);transform:perspective(1400px) rotateX(38deg) scale(.7);opacity:0;transform-origin:50% 100%;
  transition:transform .6s cubic-bezier(.3,1.35,.5,1),opacity .3s}
.pb.on{transform:none;opacity:1}
.pg{position:relative;padding:1.3rem 1.5rem;min-width:0}
.stage{position:relative;height:100%;min-height:clamp(250px,52vh,470px);perspective:1000px}
.photo{position:absolute;left:11%;right:11%;top:5%;bottom:24%;background:#fff;padding:.55rem .55rem 1.7rem;box-shadow:0 .5rem 1rem rgba(0,0,0,.35);transform:rotate(-2.2deg);z-index:2}
.photo:before{content:"";position:absolute;left:50%;top:-.9rem;width:5rem;height:1.6rem;margin-left:-2.5rem;background:rgba(246,199,68,.75);transform:rotate(3deg);box-shadow:0 .1rem .2rem rgba(0,0,0,.2)}
.photo .in{width:100%;height:100%;background:#cfe9ef;display:grid;place-items:center;overflow:hidden;text-align:center;color:#3f7d92;font-size:.95rem;line-height:1.3}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .cap{position:absolute;left:.5rem;right:.5rem;bottom:.3rem;text-align:center;font-family:'Caveat',cursive;font-size:1.3rem;line-height:1.1;outline:none}
html.edit .photo{cursor:pointer;outline:3px dashed var(--coral);outline-offset:3px}
.pu{position:absolute;transform-origin:50% 100%;transform:rotateX(-92deg);opacity:0;transition:transform .75s cubic-bezier(.3,1.55,.5,1) var(--dl,0s),opacity .01s var(--dl,0s);filter:drop-shadow(0 .5rem .35rem rgba(0,0,0,.3))}
.go .pu{transform:rotateX(0);opacity:1}
.pu svg{width:100%;height:100%;display:block;overflow:visible}
.wave1{left:-3%;right:-3%;bottom:6%;height:30%;z-index:1}
.wave2{left:-3%;right:-3%;bottom:0;height:22%;z-index:4}
.kelpL{left:1%;bottom:8%;width:17%;height:62%;z-index:3}
.coralR{right:1%;bottom:8%;width:20%;height:44%;z-index:3}
.rib{left:50%;bottom:6%;width:62%;margin-left:-31%;z-index:5;height:auto;text-align:center;filter:drop-shadow(0 .4rem .25rem rgba(0,0,0,.35))}
.rib span{display:block;background:linear-gradient(#ff8d7e,#ee5f52);color:#fff;font-weight:600;padding:.35rem 1rem;font-size:1.05rem;border-radius:.3rem;outline:none;clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
.bub{width:2.6rem;height:2.6rem;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#bdeaf6 55%,#6cc3de);z-index:6;animation:bobs 2.6s ease-in-out infinite alternate;filter:none}
.bub.b1{left:6%;top:3%}.bub.b2{right:5%;top:12%;width:1.7rem;height:1.7rem}.bub.b3{left:78%;top:-2%;width:2.1rem;height:2.1rem}
.go .bub{animation:bobs 2.6s ease-in-out infinite alternate}
.pr{display:flex;flex-direction:column;gap:.5rem;justify-content:center}
.stopl{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#4a7f94}
.yr{font-family:'Caveat',cursive;font-size:2.4rem;line-height:1;color:var(--coral);outline:none}
.pr h2{margin:0;font-size:clamp(1.4rem,3.6vw,2.1rem);line-height:1.1;outline:none}
.pr p{margin:0;font-size:1.05rem;line-height:1.5;outline:none;white-space:pre-wrap;overflow:auto;max-height:42vh}
.nv{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.5rem}
.btn{background:var(--teal);color:#fff;border-radius:99px;padding:.65rem 1.2rem;font-weight:600;box-shadow:0 .25rem 0 #0e857f}
.btn.g{background:var(--gold);color:#4b2a0c;box-shadow:0 .25rem 0 #c79a1d}
.btn.r{background:var(--coral);box-shadow:0 .25rem 0 #c9483a}
.btn:active{transform:translateY(.15rem)}
.xb{position:absolute;right:-.4rem;top:-2.7rem;width:2.4rem;height:2.4rem;border-radius:50%;background:#fff;font-size:1.1rem;box-shadow:0 .2rem 0 rgba(0,0,0,.2);z-index:9}
.edtools{display:none;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
html.edit .edtools{display:flex}
.edtools .btn{font-size:.82rem;padding:.4rem .8rem}
html.edit [data-ed]{outline:2px dashed rgba(255,122,107,.8);outline-offset:3px;cursor:text}

/* ---------- penutup / kue ---------- */
#fin{background:radial-gradient(circle at 50% 30%,rgba(255,150,120,.35),rgba(2,20,40,.9));overflow:auto}
#fin .wrap{width:min(94vw,560px);display:flex;flex-direction:column;align-items:center;gap:.6rem;text-align:center;color:#fff}
#cake{width:min(70vw,300px);cursor:pointer;filter:drop-shadow(0 1rem 1rem rgba(0,0,0,.4));animation:bobs 3s ease-in-out infinite alternate}
.flame{transform-origin:50% 100%;transform-box:fill-box;animation:fl .25s ease-in-out infinite alternate}
@keyframes fl{from{transform:scale(.9,1.05) rotate(-3deg)}to{transform:scale(1.05,.92) rotate(3deg)}}
.out .flame{display:none}
#hint{font-size:1.2rem;font-weight:600}
#letter{background:linear-gradient(var(--paper),#f6e5b9);color:var(--ink);border-radius:.9rem;padding:1.3rem 1.4rem;width:100%;transform-origin:50% 0;transform:perspective(900px) rotateX(-95deg);opacity:0;
  transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .3s;box-shadow:0 1rem 2rem rgba(0,0,0,.4),0 0 0 .35rem var(--gold)}
#letter.on{transform:none;opacity:1}
#letter h2{margin:.1rem 0;font-family:'Caveat',cursive;font-size:2.5rem;color:var(--coral);font-weight:600;outline:none}
#letter p{white-space:pre-wrap;margin:.4rem 0;line-height:1.5;font-size:1.05rem;outline:none}
#letter .fr{font-family:'Caveat',cursive;font-size:1.7rem;outline:none}
#conf{position:fixed;inset:0;z-index:80;pointer-events:none}

@media (max-width:760px),(max-aspect-ratio:1/1){
  .pb{grid-template-columns:1fr;overflow:auto;background:var(--paper)}
  .stage{min-height:clamp(250px,40vh,380px)}
  .pg{padding:1rem 1.1rem}
  .pr p{max-height:none}
  .xb{top:-2.6rem}
}
@media (max-height:520px){.arr{width:3.4rem;height:3.4rem}#hud{padding-top:.3rem}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<div id="app">
  <div class="sky" id="sky1"></div><div class="sky" id="sky2"></div><div class="sky" id="sky3"></div>
  <div id="rays"></div>
  <div id="fish"></div>
  <div class="lay" id="far"></div>
  <div class="lay" id="mid"></div>
  <div id="world"></div>
  <div id="buddy"></div>
  <div id="player"><div id="pin"></div></div>
  <div id="prompt" hidden><button id="openbtn">📖 Buka kenangan</button></div>
  <div class="lay" id="front"></div>
  <div id="bubbles"></div>

  <div id="hud" hidden>
    <div class="chip"><span>🫧</span><span id="dots"></span></div>
    <div class="chip" id="chlbl">Kota Gelembung</div>
    <button class="ib" id="snd" aria-label="Suara">🔊</button>
  </div>
  <div id="ctl" hidden>
    <button class="arr" id="bl" aria-label="Jalan ke kiri">◀</button>
    <button id="auto">Jalan otomatis ▶▶</button>
    <button class="arr" id="br" aria-label="Jalan ke kanan">▶</button>
  </div>
</div>

<!-- sampul buku -->
